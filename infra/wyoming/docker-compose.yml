# Wyoming voice services for HA Container installs (no Supervisor / no add-ons).
# Runs on the main PC (192.168.0.10) — Whisper uses the RTX 5060 Ti via
# Docker Desktop's WSL2 GPU passthrough.
#   - faster-whisper GPU (STT, port 10300)
#   - piper            (TTS, port 10200)
#
# Start:  docker compose -f F:\ROBOTAI\infra\wyoming\docker-compose.yml up -d
# Stop:   docker compose -f F:\ROBOTAI\infra\wyoming\docker-compose.yml down
# Logs:   docker compose -f F:\ROBOTAI\infra\wyoming\docker-compose.yml logs -f
#
# After services are up, in HA (192.168.0.166) add the "Wyoming Protocol"
# integration twice, host = 192.168.0.10:
#   1. Port 10300 → Whisper (STT)
#   2. Port 10200 → Piper (TTS)
#
# Wake word is on-device: the DualEye runs micro_wake_word with the custom
# "mister_robot" model (tools/wake_word_output/) — no server-side openWakeWord
# container is needed. The old wyoming-openwakeword service was removed
# 2026-07-14; its named volume (wyoming_openwakeword-data) is left in place.

services:
  faster-whisper:
    # linuxserver GPU build speaks the same Wyoming protocol as rhasspy/wyoming-whisper.
    # medium-int8 + beam 5 is real-time on the RTX 5060 Ti (was small-int8/beam 1 on CPU).
    image: lscr.io/linuxserver/faster-whisper:gpu
    container_name: wyoming-whisper
    restart: unless-stopped
    gpus: all
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Toronto
      - WHISPER_MODEL=medium-int8
      - WHISPER_BEAM=5
      - WHISPER_LANG=auto  # multilingual family: en/fr/es auto-detect (Conchita persona)
    ports:
      - "10300:10300"
    volumes:
      - whisper-data:/config

  piper:
    image: rhasspy/wyoming-piper:latest
    container_name: wyoming-piper
    restart: unless-stopped
    ports:
      - "10200:10200"
    volumes:
      - piper-data:/data
    command: >
      --voice en_US-amy-medium
      --uri tcp://0.0.0.0:10200

  # Server-side wake word for the LIVING ROOM Jabra satellite (Assist
  # Microphone add-on) — offloads wake processing from the RAM-tight HA VM
  # to this PC, and gives the living room the custom "Mister Robot" model
  # (the openWakeWord onnx trained 2026-06). The robot head still does
  # wake on-device (microWakeWord) and does NOT use this container.
  openwakeword:
    image: rhasspy/wyoming-openwakeword:latest
    container_name: wyoming-openwakeword
    restart: unless-stopped
    ports:
      - "10400:10400"
    volumes:
      - ./oww-models:/custom
    command: >
      --custom-model-dir /custom
      --preload-model mister_robot
      --threshold 0.8
      --uri tcp://0.0.0.0:10400

volumes:
  whisper-data:
  piper-data:
