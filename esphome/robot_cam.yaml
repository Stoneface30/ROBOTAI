# Robot Cam — AI-Thinker ESP32-CAM (OV2640)
# Board: AI-Thinker ESP32-CAM module (ESP32-S + OV2640 24-pin FPC ribbon)
# Flash: First time via CP2104 UART (see README). All updates OTA.

substitutions:
  device_name: "RobotCam"
  device_id: "robot_cam"

esphome:
  name: robot-cam
  friendly_name: "Robot Cam"
  min_version: "2024.6.0"

esp32:
  board: esp32cam
  framework:
    type: arduino   # esp32_camera requires arduino — esp-idf not supported

# 8MB PSRAM — required or esp32_camera refuses to init
psram:
  mode: quad
  speed: 80MHz

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key_robot_cam
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_robot_cam

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: 192.168.0.104      # update to match your network
  manual_ip:
    static_ip: 192.168.0.104
    gateway: 192.168.0.1
    subnet: 255.255.255.0
  power_save_mode: none
  ap:
    ssid: "RobotCam Fallback"
    password: !secret ap_fallback_password

captive_portal:

# -------------------------------------------------------
# I2C bus — separate definition required (i2c_pins deprecated in 2026+)
# -------------------------------------------------------
i2c:
  sda: GPIO26
  scl: GPIO27
  id: i2c_camera

# -------------------------------------------------------
# OV2640 Camera — AI-Thinker fixed pinout
# IMPORTANT: power_down_pin: GPIO32 is mandatory.
#   Without it, OV2640 probe returns ESP_ERR_NOT_SUPPORTED.
#   GPIO32 has a 4.7kΩ pull-down on AI-Thinker but ESPHome
#   must drive it explicitly LOW to guarantee wake.
# -------------------------------------------------------
esp32_camera:
  external_clock:
    pin: GPIO0
    frequency: 20MHz
  i2c_id: i2c_camera
  data_pins: [GPIO5, GPIO18, GPIO19, GPIO21, GPIO36, GPIO39, GPIO34, GPIO35]
  vsync_pin: GPIO25
  href_pin: GPIO23
  pixel_clock_pin: GPIO22
  power_down_pin: GPIO32
  name: "Robot Eye"
  resolution: 640x480
  jpeg_quality: 12
  max_framerate: 10fps
  idle_framerate: 0.1fps
  vertical_flip: false
  horizontal_mirror: false

# Flash LED — GPIO4 (onboard, very bright — keep duty low)
output:
  - platform: ledc
    pin: GPIO4
    id: cam_led_pwm
    frequency: 1000Hz

light:
  - platform: monochromatic
    output: cam_led_pwm
    name: "Robot Eye LED"
    id: robot_cam_led
    default_transition_length: 0s

sensor:
  - platform: wifi_signal
    name: "RobotCam WiFi"
    update_interval: 60s

  - platform: internal_temperature
    name: "RobotCam Temp"
    update_interval: 30s

button:
  - platform: restart
    name: "RobotCam Restart"
