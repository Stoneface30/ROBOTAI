# Waveshare ESP32-S3-DualEye-LCD-1.28 — ROBOTAI head unit
#
# Task 3 (audio path only). Task 4 adds the two GC9A01A eyes.
#
# Pin map is verified against the official Waveshare repo:
#   github.com/waveshareteam/ESP32-S3-DualEye-Touch-LCD-1.28
# (see docs/hardware.md and L-rule rule-vendor-reference-first.md)
#
# ES8311 master-mode patch is vendored at esphome/components/es8311/
# (see esphome/components/es8311/ATTRIBUTION.md for provenance).

substitutions:
  device_name: dualeye
  friendly: Robot Head

  # Audio bus pins (DualEye)
  i2s_mclk: GPIO12
  i2s_bclk: GPIO13
  i2s_lrclk: GPIO14
  i2s_din: GPIO15    # ES7210 mic → ESP32
  i2s_dout: GPIO16   # ESP32 → ES8311 speaker
  pa_enable: GPIO9   # ES8311 PA amplifier enable (active HIGH)

  # I2C bus 1 — ES8311, ES7210, QMI8658 IMU
  i2c_scl: GPIO10
  i2c_sda: GPIO11

  # SPI bus (shared by both GC9A01A displays)
  lcd_mosi: GPIO42
  lcd_sclk: GPIO41
  lcd_dc: GPIO45     # shared between LCD1 and LCD2
  # LCD1 = left eye
  lcd1_cs: GPIO47
  lcd1_rst: GPIO48
  lcd1_bl: GPIO46
  # LCD2 = right eye
  lcd2_cs: GPIO38
  lcd2_rst: GPIO8
  lcd2_bl: GPIO39

  # Audio formats
  i2s_sample_rate: "16000"
  i2s_mclk_multiple: "256"

esphome:
  name: ${device_name}
  friendly_name: ${friendly}
  min_version: 2025.8.0
  includes:
    - eyes.h
  platformio_options:
    board_build.flash_mode: dio
  # User-tuned volume (2026-07-16): 0.85 too loud, 0.75 confirmed perfect
  on_boot:
    - priority: -100
      then:
        - media_player.volume_set:
            id: head_media_player
            volume: 0.75

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  cpu_frequency: 240MHz
  flash_size: 16MB
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
      # microWakeWord runs faster with code+data in PSRAM
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO   # bump to DEBUG when troubleshooting audio
  # Hardware UART on GPIO43/44 is repurposed to read the tethered ESP32-CAM's
  # boot log (SH1.0 Pin 9/10). Logger output goes via WiFi (native API) only —
  # access with: esphome logs dualeye.yaml --device dualeye.local
  hardware_uart: USB_SERIAL_JTAG

# UART bridge — reads the ESP32-CAM's TX line (cam's boot output) via SH1.0 Pin 9.
# Cam's TX (U0T pin) → SH1.0 Pin 9 (DualEye UART_RXD) → GPIO44 here.
# Every line the cam prints lands in the DualEye logger as CAM_LOG: <line>.
uart:
  id: cam_uart
  rx_pin: GPIO44
  baud_rate: 115200
  rx_buffer_size: 1024
  debug:
    direction: RX
    after:
      delimiter: "\n"
    sequence:
      - lambda: |-
          std::string line(bytes.begin(), bytes.end());
          ESP_LOGI("CAM_LOG", "%s", line.c_str());

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  reboot_timeout: 10min
  ap:
    ssid: "DualEye Setup"
    password: !secret ap_fallback_password

captive_portal:

api:
  encryption:
    key: !secret api_key_dualeye
  # HA-callable expression actions: esphome.dualeye_wink / _celebrate
  services:
    - service: wink
      then:
        - script.execute: do_wink
    - service: celebrate
      then:
        - script.execute: do_celebrate

ota:
  - platform: esphome
    password: !secret ota_dualeye

time:
  - platform: homeassistant
    id: time_ha

# Local ES8311 master-mode patch (esphome/components/es8311/)
external_components:
  - source:
      type: local
      path: components
    components: [es8311]

i2c:
  - id: internal_i2c
    sda: ${i2c_sda}
    scl: ${i2c_scl}
    scan: true
    frequency: 400kHz

# SPI bus for both GC9A01A displays. DC pin is shared between LCD1 and LCD2;
# ESPHome arbitrates by CS pin per display platform.
spi:
  - id: lcd_spi
    clk_pin: ${lcd_sclk}
    mosi_pin: ${lcd_mosi}
    interface: hardware

# Eye expression state. 0 idle, 1 listening, 2 thinking/glance-up, 3 speaking,
# 4 error, 5 sleepy, 6 laundry-spin, 7 dance, 8 silly. Rendering in eyes.h.
globals:
  - id: eye_state
    type: int
    restore_value: no
    initial_value: '0'
  - id: blink_start
    type: uint32_t
    restore_value: no
    initial_value: '0'  # millis() of last blink trigger; eyes.h computes the curve
  - id: timer_progress
    type: float
    restore_value: no
    initial_value: '0.0'
  # Iris ring color - follows HA weather condition
  - id: iris_r
    type: int
    initial_value: '160'
  - id: iris_g
    type: int
    initial_value: '160'
  - id: iris_b
    type: int
    initial_value: '170'

# Weather condition from HA tints the iris (idea #4)
text_sensor:
  # Conversation transcript mirrors — consumed by HA automation that pushes
  # the MagicMirror "Mister Robot said" card (top-50 #24/#25)
  - platform: template
    id: last_heard
    name: Last Heard
  - platform: template
    id: last_reply
    name: Last Reply
  - platform: homeassistant
    id: ha_weather
    entity_id: weather.forecast_home
    on_value:
      - lambda: |-
          std::string c = x;
          if (c == "sunny" || c == "clear-night")      { id(iris_r)=255; id(iris_g)=190; id(iris_b)=60; }
          else if (c == "rainy" || c == "pouring")     { id(iris_r)=70;  id(iris_g)=130; id(iris_b)=255; }
          else if (c == "snowy" || c == "snowy-rainy") { id(iris_r)=220; id(iris_g)=235; id(iris_b)=255; }
          else if (c == "lightning" || c == "lightning-rainy") { id(iris_r)=255; id(iris_g)=230; id(iris_b)=0; }
          else if (c == "fog")                          { id(iris_r)=120; id(iris_g)=120; id(iris_b)=120; }
          else                                          { id(iris_r)=150; id(iris_g)=150; id(iris_b)=165; }

# Backlights — direct GPIO, active HIGH (verified Waveshare convention)
output:
  - platform: gpio
    pin: ${lcd1_bl}
    id: bl_left_out
  - platform: gpio
    pin: ${lcd2_bl}
    id: bl_right_out

light:
  - platform: binary
    output: bl_left_out
    id: bl_left
    name: Left Eye Backlight
    restore_mode: ALWAYS_ON
  - platform: binary
    output: bl_right_out
    id: bl_right
    name: Right Eye Backlight
    restore_mode: ALWAYS_ON

display:
  - platform: mipi_spi
    model: GC9A01A
    id: left_eye
    spi_id: lcd_spi
    cs_pin: ${lcd1_cs}
    dc_pin:
      number: ${lcd_dc}
      allow_other_uses: true
    reset_pin: ${lcd1_rst}
    invert_colors: true
    rotation: 90   # panels are physically mounted rotated 90° in the head
    update_interval: 66ms   # 15 FPS — 20 FPS starved micro_wake_word ring buffer (L292 era bug #2)
    lambda: |-
      int month = id(time_ha).now().is_valid() ? id(time_ha).now().month : 0;
      draw_robot_eye(it, id(eye_state), millis(), id(blink_start),
                     id(timer_progress), id(iris_r), id(iris_g), id(iris_b),
                     month, false);

  - platform: mipi_spi
    model: GC9A01A
    id: right_eye
    spi_id: lcd_spi
    cs_pin: ${lcd2_cs}
    dc_pin:
      number: ${lcd_dc}
      allow_other_uses: true
    reset_pin: ${lcd2_rst}
    invert_colors: true
    # No mirror transform: vendor config.h sets LCD2 MIRROR_X/Y=false. The old
    # mirror flags made 'thinking' look up on one eye and down on the other.
    rotation: 90
    update_interval: 66ms
    lambda: |-
      int month = id(time_ha).now().is_valid() ? id(time_ha).now().month : 0;
      draw_robot_eye(it, id(eye_state), millis(), id(blink_start),
                     id(timer_progress), id(iris_r), id(iris_g), id(iris_b),
                     month, true);

# Random idle blink every ~3-7 seconds. Closes for 120 ms.
interval:
  - interval: 4s
    then:
      - if:
          condition:
            lambda: 'return id(eye_state) == 0;'   # only blink when idle
          then:
            - script.execute: do_blink

# Blink = timestamp; eyes.h renders the close/hold/open curve time-continuously
script:
  - id: do_blink
    mode: restart
    then:
      - lambda: 'id(blink_start) = millis();'
  - id: do_wink
    mode: restart
    then:
      - lambda: 'id(blink_start) = millis();'
      - delay: 400ms
      - lambda: 'id(blink_start) = millis();'
  - id: do_celebrate
    mode: restart
    then:
      - lambda: 'id(eye_state) = 7;'   # dance
      - delay: 4s
      - lambda: 'if (id(eye_state) == 7) id(eye_state) = 0;'

# Two i2s_audio buses share LRCK/BCLK/MCLK between speaker (output) and mic (input).
# ESPHome ≥2025 requires explicit allow_other_uses on shared pins.
# i2s_in must also declare MCLK so the ESP-IDF capture peripheral outputs the clock
# on GPIO12 — without it the ES7210 slave ADC starves and wake word detection fails.
i2s_audio:
  - id: i2s_out
    i2s_lrclk_pin:
      number: ${i2s_lrclk}
      allow_other_uses: true
    i2s_bclk_pin:
      number: ${i2s_bclk}
      allow_other_uses: true
    i2s_mclk_pin:
      number: ${i2s_mclk}
      allow_other_uses: true

  - id: i2s_in
    i2s_lrclk_pin:
      number: ${i2s_lrclk}
      allow_other_uses: true
    i2s_bclk_pin:
      number: ${i2s_bclk}
      allow_other_uses: true
    i2s_mclk_pin:
      number: ${i2s_mclk}
      allow_other_uses: true

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: internal_i2c
    address: 0x18
    sample_rate: ${i2s_sample_rate}
    bits_per_sample: 16bit
    use_mclk: true
    use_microphone: false   # we use ES7210 for capture, not ES8311's mic
    force_master: true      # OUR patched component drives BCLK/LRCK so ES7210 is the slave
    mclk_multiple: 256

audio_adc:
  - platform: es7210
    id: es7210_adc
    i2c_id: internal_i2c
    sample_rate: ${i2s_sample_rate}
    bits_per_sample: 16bit
    # ES7210 default address 0x40; tdm mode is on by default for the 4-mic array

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_in
    i2s_din_pin: ${i2s_din}
    adc_type: external
    pdm: false
    i2s_mode: secondary   # ES8311 is bus master; mic ADC is slave
    sample_rate: ${i2s_sample_rate}
    bits_per_sample: 16bit
    use_apll: true
    mclk_multiple: 256
    channel: left          # ES7210 mic 1 of 4 (TDM left channel)

speaker:
  - platform: i2s_audio
    id: spk
    i2s_audio_id: i2s_out
    i2s_dout_pin: ${i2s_dout}
    audio_dac: es8311_dac
    dac_type: external
    i2s_mode: secondary    # ESPHome side is secondary; our patched ES8311 is master
    timeout: never
    buffer_duration: 100ms
    sample_rate: ${i2s_sample_rate}
    bits_per_sample: 16bit
    use_apll: true
    mclk_multiple: 256
    channel: mono

  # Mixer pipeline so HA media announcements and voice TTS share the speaker
  - platform: mixer
    id: spk_mixer
    output_speaker: spk
    num_channels: 1
    source_speakers:
      - id: spk_announcement_in
        timeout: never
      - id: spk_media_in
        timeout: never

  - platform: resampler
    id: spk_announcement_resampler
    output_speaker: spk_announcement_in
  - platform: resampler
    id: spk_media_resampler
    output_speaker: spk_media_in

media_player:
  - platform: speaker
    id: head_media_player
    name: Robot Head Speaker
    volume_increment: 0.05
    volume_min: 0.3
    volume_max: 0.9
    files:
      - id: wake_chime
        file: ../tools/audio/wake_confirm.wav
    announcement_pipeline:
      speaker: spk_announcement_resampler
      format: FLAC
      num_channels: 1
      sample_rate: 48000
    media_pipeline:
      speaker: spk_media_resampler
      format: FLAC
      num_channels: 1
      sample_rate: 48000

# PA amp enable — kept ON by default so speaker is live
switch:
  - platform: gpio
    id: pa_enable_switch
    name: Speaker Amp
    icon: mdi:speaker
    pin: ${pa_enable}
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: mic_mute
    name: Microphone Mute
    icon: mdi:microphone-off
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - micro_wake_word.stop:
      - voice_assistant.stop:
    turn_off_action:
      - micro_wake_word.start:

micro_wake_word:
  id: mww
  microphone:
    microphone: mic
    channels: 0
  stop_after_detection: false
  models:
    - model:
        type: local
        path: ../tools/wake_word_output/mister_robot.json
      id: mister_robot
      # Manifest ships 0.5 which false-triggers on normal speech (2-speaker
      # training set). 0.90 measured as usable; raise further if it still
      # false-wakes, lower if it misses real wakes.
      probability_cutoff: 0.90
  vad:
    probability_cutoff: 0.5
  on_wake_word_detected:
    - script.execute: do_blink
    # Chime is baked into flash — no internet/GitHub dependency, ~0 latency
    - media_player.speaker.play_on_device_media_file:
        media_file: wake_chime
        announcement: true
    # EXPLICIT pipeline start — the implicit micro_wake_word->voice_assistant
    # link never fired (wake chimed but satellite stayed idle; bug found
    # 2026-07-16: user heard the chime, question went nowhere)
    - voice_assistant.start:

voice_assistant:
  id: va
  microphone:
    microphone: mic
    channels: 0
  media_player: head_media_player
  micro_wake_word: mww
  use_wake_word: false
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 1.0
  on_client_connected:
    - micro_wake_word.start:
    - lambda: 'id(eye_state) = 0;'
    - logger.log: "HA connected — wake word active"
  # Fires per-client: a closing `esphome logs` session triggers this while HA
  # is still connected (this silently killed the wake word repeatedly on
  # 2026-07-16). Only treat it as "HA gone" when NO api client remains.
  on_client_disconnected:
    - if:
        condition:
          api.connected:
        then:
          - micro_wake_word.start:   # idempotent; keeps wake alive for HA
        else:
          - micro_wake_word.stop:
          - voice_assistant.stop:
          - lambda: 'id(eye_state) = 4;'
          - logger.log: "All API clients disconnected"
  on_listening:
    - lambda: 'id(eye_state) = 1;'   # eyes wide / dilated pupil
  on_stt_vad_start:
    - lambda: 'id(eye_state) = 1;'   # still listening (voice detected)
  on_stt_end:
    - text_sensor.template.publish:
        id: last_heard
        state: !lambda 'return x;'
  on_stt_vad_end:
    - lambda: 'id(eye_state) = 2;'   # thinking (look up)
  on_tts_start:
    - lambda: 'id(eye_state) = 3;'   # speaking
    - text_sensor.template.publish:
        id: last_reply
        state: !lambda 'return x;'
  on_end:
    - lambda: 'id(eye_state) = 0;'   # back to idle
  on_error:
    - lambda: 'id(eye_state) = 4;'
    - delay: 2s
    - lambda: 'id(eye_state) = 0;'
    - logger.log:
        format: "Voice assistant error: %s"
        args: ["code.c_str()"]
  # Voice timers ("set a timer for 10 minutes") — countdown ring on the eyes
  on_timer_tick:
    - lambda: |-
        float p = 0.0f;
        for (auto &t : timers) {
          if (t.is_active && t.total_seconds > 0) {
            p = 1.0f - ((float) t.seconds_left / (float) t.total_seconds);
            break;
          }
        }
        id(timer_progress) = p;
  on_timer_finished:
    - lambda: 'id(timer_progress) = 0.0f;'
    - script.execute: do_wink
    - media_player.speaker.play_on_device_media_file:
        media_file: wake_chime
        announcement: true
    - delay: 400ms
    - media_player.speaker.play_on_device_media_file:
        media_file: wake_chime
        announcement: true

number:
  - platform: template
    id: eye_state_ctrl
    name: Eye State
    icon: mdi:eye
    entity_category: config
    min_value: 0
    max_value: 10
    step: 1
    set_action:
      - lambda: 'id(eye_state) = (int)x;'

button:
  - platform: restart
    id: restart_button
    name: Restart
    entity_category: config
    icon: mdi:restart
  - platform: factory_reset
    id: factory_reset_button
    name: Factory Reset
    entity_category: diagnostic
    disabled_by_default: true

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true
    name: Boot Button
    on_click:
      - min_length: 50ms
        max_length: 500ms
        then:
          - voice_assistant.start:
      - min_length: 1500ms
        max_length: 5000ms
        then:
          - switch.toggle: mic_mute
    # Double-click = read the shopping list aloud (Top20 #9, button-only test)
    on_multi_click:
      - timing:
          - ON for at most 400ms
          - OFF for at most 300ms
          - ON for at most 400ms
          - OFF for at least 200ms
        then:
          - homeassistant.service:
              service: script.read_shopping_list
