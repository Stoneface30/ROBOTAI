# Waveshare ESP32-S3-DualEye-LCD-1.28 — ROBOTAI head unit
#
# Task 3 (audio path only). Task 4 adds the two GC9A01A eyes.
#
# Pin map is verified against the official Waveshare repo:
#   github.com/waveshareteam/ESP32-S3-DualEye-Touch-LCD-1.28
# (see docs/hardware.md and L-rule rule-vendor-reference-first.md)
#
# ES8311 master-mode patch is vendored at esphome/components/es8311/
# (see esphome/components/es8311/ATTRIBUTION.md for provenance).

substitutions:
  device_name: dualeye
  friendly: Robot Head

  # Audio bus pins (DualEye)
  i2s_mclk: GPIO12
  i2s_bclk: GPIO13
  i2s_lrclk: GPIO14
  i2s_din: GPIO15    # ES7210 mic → ESP32
  i2s_dout: GPIO16   # ESP32 → ES8311 speaker
  pa_enable: GPIO9   # ES8311 PA amplifier enable (active HIGH)

  # I2C bus 1 — ES8311, ES7210, QMI8658 IMU
  i2c_scl: GPIO10
  i2c_sda: GPIO11

  # SPI bus (shared by both GC9A01A displays)
  lcd_mosi: GPIO42
  lcd_sclk: GPIO41
  lcd_dc: GPIO45     # shared between LCD1 and LCD2
  # LCD1 = left eye
  lcd1_cs: GPIO47
  lcd1_rst: GPIO48
  lcd1_bl: GPIO46
  # LCD2 = right eye
  lcd2_cs: GPIO38
  lcd2_rst: GPIO8
  lcd2_bl: GPIO39

  # Audio formats
  i2s_sample_rate: "16000"
  i2s_mclk_multiple: "256"

esphome:
  name: ${device_name}
  friendly_name: ${friendly}
  min_version: 2025.8.0
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  cpu_frequency: 240MHz
  flash_size: 16MB
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
      # microWakeWord runs faster with code+data in PSRAM
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO   # bump to DEBUG when troubleshooting audio
  # Hardware UART on GPIO43/44 is repurposed to read the tethered ESP32-CAM's
  # boot log (SH1.0 Pin 9/10). Logger output goes via WiFi (native API) only —
  # access with: esphome logs dualeye.yaml --device dualeye.local
  hardware_uart: USB_SERIAL_JTAG

# UART bridge — reads the ESP32-CAM's TX line (cam's boot output) via SH1.0 Pin 9.
# Cam's TX (U0T pin) → SH1.0 Pin 9 (DualEye UART_RXD) → GPIO44 here.
# Every line the cam prints lands in the DualEye logger as CAM_LOG: <line>.
uart:
  id: cam_uart
  rx_pin: GPIO44
  baud_rate: 115200
  rx_buffer_size: 1024
  debug:
    direction: RX
    after:
      delimiter: "\n"
    sequence:
      - lambda: |-
          std::string line(bytes.begin(), bytes.end());
          ESP_LOGI("CAM_LOG", "%s", line.c_str());

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  reboot_timeout: 10min
  ap:
    ssid: "DualEye Setup"
    password: !secret ap_fallback_password

captive_portal:

api:
  encryption:
    key: !secret api_key_dualeye

ota:
  - platform: esphome
    password: !secret ota_dualeye

time:
  - platform: homeassistant
    id: time_ha

# Local ES8311 master-mode patch (esphome/components/es8311/)
external_components:
  - source:
      type: local
      path: components
    components: [es8311]

i2c:
  - id: internal_i2c
    sda: ${i2c_sda}
    scl: ${i2c_scl}
    scan: true
    frequency: 400kHz

# SPI bus for both GC9A01A displays. DC pin is shared between LCD1 and LCD2;
# ESPHome arbitrates by CS pin per display platform.
spi:
  - id: lcd_spi
    clk_pin: ${lcd_sclk}
    mosi_pin: ${lcd_mosi}
    interface: hardware

# Eye expression state. 0 = idle (calm), 1 = listening (alert),
# 2 = thinking (looking up), 3 = speaking (active), 4 = error.
globals:
  - id: eye_state
    type: int
    restore_value: no
    initial_value: '0'
  - id: blink_phase
    type: int
    restore_value: no
    initial_value: '0'  # 0=open, 1=closed (set by blink_timer)

# Backlights — direct GPIO, active HIGH (verified Waveshare convention)
output:
  - platform: gpio
    pin: ${lcd1_bl}
    id: bl_left_out
  - platform: gpio
    pin: ${lcd2_bl}
    id: bl_right_out

light:
  - platform: binary
    output: bl_left_out
    id: bl_left
    name: Left Eye Backlight
    restore_mode: ALWAYS_ON
  - platform: binary
    output: bl_right_out
    id: bl_right
    name: Right Eye Backlight
    restore_mode: ALWAYS_ON

display:
  - platform: mipi_spi
    model: GC9A01A
    id: left_eye
    spi_id: lcd_spi
    cs_pin: ${lcd1_cs}
    dc_pin:
      number: ${lcd_dc}
      allow_other_uses: true
    reset_pin: ${lcd1_rst}
    invert_colors: true
    update_interval: 100ms   # 10 FPS — enough for face animation, cheap on CPU
    lambda: |-
      const int W = 240, H = 240;
      const int cx = W / 2, cy = H / 2;
      const int state = id(eye_state);
      const bool blinking = id(blink_phase) == 1;
      // Background
      it.fill(Color(0, 0, 0));
      // Blink overrides everything — closed eye = horizontal slit
      if (blinking) {
        it.filled_rectangle(0, cy - 6, W, 12, Color(255, 255, 255));
        return;
      }
      // Sclera (white eye)
      Color sclera = (state == 4) ? Color(255, 60, 60) : Color(255, 255, 255);
      it.filled_circle(cx, cy, 110, sclera);
      // Pupil — size + offset varies by state
      int pupil_r = 38;
      int px = cx, py = cy;
      switch (state) {
        case 1: pupil_r = 52; break;                          // listening — dilated
        case 2: py = cy - 35; pupil_r = 34; break;            // thinking — look up
        case 3: pupil_r = 44; break;                          // speaking — slightly enlarged
        case 4: pupil_r = 30; break;                          // error — small pinprick
        default: pupil_r = 38; break;                         // idle
      }
      it.filled_circle(px, py, pupil_r, Color(0, 0, 0));
      // Catch-light highlight (small white dot in pupil)
      it.filled_circle(px + pupil_r / 3, py - pupil_r / 3, 6, Color(255, 255, 255));

  - platform: mipi_spi
    model: GC9A01A
    id: right_eye
    spi_id: lcd_spi
    cs_pin: ${lcd2_cs}
    dc_pin:
      number: ${lcd_dc}
      allow_other_uses: true
    reset_pin: ${lcd2_rst}
    invert_colors: true
    transform:
      mirror_x: true
      mirror_y: true
      swap_xy: false
    update_interval: 100ms
    lambda: |-
      const int W = 240, H = 240;
      const int cx = W / 2, cy = H / 2;
      const int state = id(eye_state);
      const bool blinking = id(blink_phase) == 1;
      it.fill(Color(0, 0, 0));
      if (blinking) {
        it.filled_rectangle(0, cy - 6, W, 12, Color(255, 255, 255));
        return;
      }
      Color sclera = (state == 4) ? Color(255, 60, 60) : Color(255, 255, 255);
      it.filled_circle(cx, cy, 110, sclera);
      int pupil_r = 38;
      int px = cx, py = cy;
      switch (state) {
        case 1: pupil_r = 52; break;
        case 2: py = cy - 35; pupil_r = 34; break;
        case 3: pupil_r = 44; break;
        case 4: pupil_r = 30; break;
        default: pupil_r = 38; break;
      }
      it.filled_circle(px, py, pupil_r, Color(0, 0, 0));
      it.filled_circle(px + pupil_r / 3, py - pupil_r / 3, 6, Color(255, 255, 255));

# Random idle blink every ~3-7 seconds. Closes for 120 ms.
interval:
  - interval: 4s
    then:
      - if:
          condition:
            lambda: 'return id(eye_state) == 0;'   # only blink when idle
          then:
            - lambda: 'id(blink_phase) = 1;'
            - delay: 120ms
            - lambda: 'id(blink_phase) = 0;'

# Two i2s_audio buses share LRCK/BCLK/MCLK between speaker (output) and mic (input).
# ESPHome ≥2025 requires explicit allow_other_uses on shared pins.
# i2s_in must also declare MCLK so the ESP-IDF capture peripheral outputs the clock
# on GPIO12 — without it the ES7210 slave ADC starves and wake word detection fails.
i2s_audio:
  - id: i2s_out
    i2s_lrclk_pin:
      number: ${i2s_lrclk}
      allow_other_uses: true
    i2s_bclk_pin:
      number: ${i2s_bclk}
      allow_other_uses: true
    i2s_mclk_pin:
      number: ${i2s_mclk}
      allow_other_uses: true

  - id: i2s_in
    i2s_lrclk_pin:
      number: ${i2s_lrclk}
      allow_other_uses: true
    i2s_bclk_pin:
      number: ${i2s_bclk}
      allow_other_uses: true
    i2s_mclk_pin:
      number: ${i2s_mclk}
      allow_other_uses: true

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: internal_i2c
    address: 0x18
    sample_rate: ${i2s_sample_rate}
    bits_per_sample: 16bit
    use_mclk: true
    use_microphone: false   # we use ES7210 for capture, not ES8311's mic
    force_master: true      # OUR patched component drives BCLK/LRCK so ES7210 is the slave
    mclk_multiple: 256

audio_adc:
  - platform: es7210
    id: es7210_adc
    i2c_id: internal_i2c
    sample_rate: ${i2s_sample_rate}
    bits_per_sample: 16bit
    # ES7210 default address 0x40; tdm mode is on by default for the 4-mic array

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_in
    i2s_din_pin: ${i2s_din}
    adc_type: external
    pdm: false
    i2s_mode: secondary   # ES8311 is bus master; mic ADC is slave
    sample_rate: ${i2s_sample_rate}
    bits_per_sample: 16bit
    use_apll: true
    mclk_multiple: 256
    channel: left          # ES7210 mic 1 of 4 (TDM left channel)

speaker:
  - platform: i2s_audio
    id: spk
    i2s_audio_id: i2s_out
    i2s_dout_pin: ${i2s_dout}
    audio_dac: es8311_dac
    dac_type: external
    i2s_mode: secondary    # ESPHome side is secondary; our patched ES8311 is master
    timeout: never
    buffer_duration: 100ms
    sample_rate: ${i2s_sample_rate}
    bits_per_sample: 16bit
    use_apll: true
    mclk_multiple: 256
    channel: mono

  # Mixer pipeline so HA media announcements and voice TTS share the speaker
  - platform: mixer
    id: spk_mixer
    output_speaker: spk
    num_channels: 1
    source_speakers:
      - id: spk_announcement_in
        timeout: never
      - id: spk_media_in
        timeout: never

  - platform: resampler
    id: spk_announcement_resampler
    output_speaker: spk_announcement_in
  - platform: resampler
    id: spk_media_resampler
    output_speaker: spk_media_in

media_player:
  - platform: speaker
    id: head_media_player
    name: Robot Head Speaker
    volume_increment: 0.05
    volume_min: 0.3
    volume_max: 0.9
    announcement_pipeline:
      speaker: spk_announcement_resampler
      format: FLAC
      num_channels: 1
      sample_rate: 48000
    media_pipeline:
      speaker: spk_media_resampler
      format: FLAC
      num_channels: 1
      sample_rate: 48000

# PA amp enable — kept ON by default so speaker is live
switch:
  - platform: gpio
    id: pa_enable_switch
    name: Speaker Amp
    icon: mdi:speaker
    pin: ${pa_enable}
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: mic_mute
    name: Microphone Mute
    icon: mdi:microphone-off
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - micro_wake_word.stop:
      - voice_assistant.stop:
    turn_off_action:
      - micro_wake_word.start:

micro_wake_word:
  id: mww
  microphone:
    microphone: mic
    channels: 0
  stop_after_detection: false
  models:
    - model: github://Stoneface30/ROBOTAI/tools/wake_word_output/mister_robot.json@main
      id: mister_robot
  vad:
    probability_cutoff: 0.5

voice_assistant:
  id: va
  microphone:
    microphone: mic
    channels: 0
  media_player: head_media_player
  micro_wake_word: mww
  use_wake_word: false
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 1.0
  on_client_connected:
    - micro_wake_word.start:
    - lambda: 'id(eye_state) = 0;'
    - logger.log: "HA connected — wake word active"
  on_client_disconnected:
    - micro_wake_word.stop:
    - voice_assistant.stop:
    - lambda: 'id(eye_state) = 4;'
    - logger.log: "HA disconnected"
  on_listening:
    - lambda: 'id(eye_state) = 1;'   # eyes wide / dilated pupil
  on_stt_vad_start:
    - lambda: 'id(eye_state) = 1;'   # still listening (voice detected)
  on_stt_vad_end:
    - lambda: 'id(eye_state) = 2;'   # thinking (look up)
  on_tts_start:
    - lambda: 'id(eye_state) = 3;'   # speaking
  on_end:
    - lambda: 'id(eye_state) = 0;'   # back to idle
  on_error:
    - lambda: 'id(eye_state) = 4;'
    - delay: 2s
    - lambda: 'id(eye_state) = 0;'
    - logger.log:
        format: "Voice assistant error: %s"
        args: ["code.c_str()"]

button:
  - platform: restart
    id: restart_button
    name: Restart
    entity_category: config
    icon: mdi:restart
  - platform: factory_reset
    id: factory_reset_button
    name: Factory Reset
    entity_category: diagnostic
    disabled_by_default: true

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true
    name: Boot Button
    on_click:
      - min_length: 50ms
        max_length: 500ms
        then:
          - voice_assistant.start:
      - min_length: 1500ms
        max_length: 5000ms
        then:
          - switch.toggle: mic_mute
